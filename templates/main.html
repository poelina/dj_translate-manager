<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приём заказов</title>
    <link rel="stylesheet" href="{% static 'style/styles.css' %}">
</head>

<body>

    <div class="wrapper">

        {% block header %}

        <nav class="step-nav">

            <div class="nav">
                <a class="nav-link active" data-step="0" href="{% url 'main' %}">?</a>
                <a class="nav-link" data-step="1" href="#">1</a>
                <a class="nav-link" data-step="2" href="#">2</a>
                <a class="nav-link" data-step="3" href="#">3</a>
                <a class="nav-link" data-step="4" href="#">4</a>
                <a class="nav-link" data-step="5" href="#">5</a>
            </div>

        </nav>

        {% endblock header %}

        {% block content %}

        <main>
            
            <div class="content-container">

                <form id="multi-step-form" method="POST" action="">

                    <div class="form-step active" data-step="0">
                        
                        <h2>Выберите тип перевода</h2>

                        <div class="form-group options-grid">
                            <label class="option-card">
                                <input type="radio" name="service_type" value="speech" required>
                                <span>Устный перевод</span>
                            </label>
                            <label class="option-card">
                                <input type="radio" name="service_type" value="text">
                                <span>Письменный перевод</span>
                            </label>
                        </div>

                        <div class="form-buttons">
                            <button type="button" class="btn btn-next">Далее</button>
                        </div>

                    </div>

                </form>

            </div>

        </main>

        {% endblock content %}

    </div>

</body>

<script>

    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('multi-step-form');
        
        form.addEventListener('click', (e) => {
            if (e.target.classList.contains('btn-next')) {
                const selectedService = form.querySelector('input[name="service_type"]:checked')?.value;
                
                if (!selectedService) {
                    form.querySelector('input[name="service_type"]').reportValidity();
                    return;
                }

                if (selectedService === 'text') {
                    window.location.href = "{% url 'text' %}";
                } else if (selectedService === 'speech') {
                    window.location.href = "{% url 'speech' %}";
                }
            }
        });
    });

</script>


</html>
